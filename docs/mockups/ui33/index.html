<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công việc OneCrew</title>
<style>
:root{--paper:#F6F8FB;--sheet:#FFFFFF;--ink:#1D2840;--ink2:#566179;--rule:#DCE3EC;--margin:#EDB1BA;--sel:#EAF0FA;--pen:#C01F3C;--pen-bg:#FBE9EC;--ok:#21784A;--ok-bg:#E5F2EA;--run:#2457A6;--run-bg:#E7EEF9;--wait:#9A6210;--wait-bg:#FAF0DC;--fail:#BF420F;--fail-bg:#FBEBE2;--idle:#7F889C;--idle-bg:#EDF0F4;--focus:#2457A6;--m-need:#C01F3C;--m-run:#2457A6;--m-wait:#B7791F;--m-ok:#21784A;--m-fail:#BF420F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#141B27;--sheet:#1B2433;--ink:#E4E9F2;--ink2:#A2ACC0;--rule:#2B3547;--margin:#7A3B47;--sel:#22314A;--pen:#FF7088;--pen-bg:#3A1F28;--ok:#5FC68E;--ok-bg:#1C3328;--run:#86ABF2;--run-bg:#1E2B45;--wait:#E5B65C;--wait-bg:#3A2F1A;--fail:#F58C5E;--fail-bg:#3B2419;--idle:#8E97AB;--idle-bg:#263042;--focus:#86ABF2;--m-need:#E0506A;--m-run:#5B8FE8;--m-wait:#B8862C;--m-ok:#2A9C86;--m-fail:#E07A45;color-scheme:dark}}
:root[data-theme=dark]{--paper:#141B27;--sheet:#1B2433;--ink:#E4E9F2;--ink2:#A2ACC0;--rule:#2B3547;--margin:#7A3B47;--sel:#22314A;--pen:#FF7088;--pen-bg:#3A1F28;--ok:#5FC68E;--ok-bg:#1C3328;--run:#86ABF2;--run-bg:#1E2B45;--wait:#E5B65C;--wait-bg:#3A2F1A;--fail:#F58C5E;--fail-bg:#3B2419;--idle:#8E97AB;--idle-bg:#263042;--focus:#86ABF2;--m-need:#E0506A;--m-run:#5B8FE8;--m-wait:#B8862C;--m-ok:#2A9C86;--m-fail:#E07A45;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--rule);background:var(--sheet);position:relative}
.brand{font-weight:700;letter-spacing:-.01em}
.srcbadge{margin-left:auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--wait-bg);color:var(--wait);border:1px dashed var(--wait)}
.srcbadge.real{background:var(--ok-bg);color:var(--ok);border-style:solid}
.hbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;font:inherit;font-size:14px;font-weight:600;padding:0 8px;border-radius:6px;border:1px solid var(--rule);background:transparent;color:var(--ink2);cursor:pointer}
.legend{position:absolute;right:16px;top:52px;z-index:5;width:340px;max-width:calc(100vw - 32px);max-height:calc(100vh - 70px);overflow:auto;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);box-shadow:0 8px 24px rgba(20,27,39,.18);font-size:13.5px}
.legend h4{margin:8px 0 4px;font-size:13px;color:var(--ink2)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend li{display:flex;align-items:center;gap:8px}
main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);height:calc(100vh - 48px);height:calc(100dvh - 48px)}
.pane{overflow:auto;min-width:0;padding:12px 16px}
#listpane{border-right:1px solid var(--rule)}
#back{display:none;font:inherit;font-size:14px;padding:4px 10px;margin:0 0 8px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
/* icons: shape + colour carry the state, the label rides along as aria-label/title */
.ic{display:inline-flex;flex:none;width:18px;height:18px}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
.ic.lg{width:30px;height:30px}
.x-ok{color:var(--ok)}.x-run{color:var(--run)}.x-wait{color:var(--wait)}.x-fail{color:var(--fail)}.x-need,.x-stop{color:var(--pen)}.x-idle,.x-closed,.x-unknown{color:var(--ink2)}
/* segments: milestone / part state; texture as well as colour */
.seg-ok{background:var(--m-ok)}
.seg-run{background:linear-gradient(90deg,var(--m-run) 55%,var(--run-bg) 55%)}
.seg-wait{background:var(--m-wait)}
.seg-recheck{background:repeating-linear-gradient(45deg,var(--m-wait) 0,var(--m-wait) 2px,var(--wait-bg) 2px,var(--wait-bg) 4px)}
.seg-inconclusive{background:repeating-linear-gradient(90deg,var(--m-wait) 0,var(--m-wait) 3px,var(--wait-bg) 3px,var(--wait-bg) 5px)}
.seg-fail{background:repeating-linear-gradient(45deg,var(--m-fail) 0,var(--m-fail) 2px,var(--fail-bg) 2px,var(--fail-bg) 3px),var(--m-fail)}
.seg-stop{background:var(--m-need)}
.seg-pending{box-shadow:inset 0 0 0 1.5px var(--idle)}
.seg-unknown{background:repeating-linear-gradient(90deg,var(--idle) 0,var(--idle) 2px,transparent 2px,transparent 4px)}
.swatch{display:inline-block;flex:none;width:28px;height:8px;border-radius:2px}
/* list */
.glance{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.hero{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink2);min-width:0}
.hero b{font-size:30px;line-height:1;color:var(--ink)}
.hero.has-need,.hero.has-need b{color:var(--pen)}
.badges{display:flex;gap:6px;margin-left:auto}
.badge{position:relative}
.badge>summary{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;list-style:none;font-size:13px;white-space:nowrap}
.badge>summary::-webkit-details-marker{display:none}
.badge>summary b{font-size:14px}
.badge-body{position:absolute;right:0;top:34px;z-index:4;width:320px;max-width:calc(100vw - 32px);padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);box-shadow:0 8px 24px rgba(20,27,39,.15);font-size:13.5px;overflow-wrap:anywhere}
.badge-body ul{list-style:none;margin:4px 0;padding:0;display:grid;gap:4px}
.badge-body li{display:flex;gap:6px;align-items:flex-start}
.sbar{display:flex;gap:2px;height:14px;margin:0 0 8px}
.sb{display:block;min-width:8px;border-radius:2px}
.sb:first-child{border-top-left-radius:4px;border-bottom-left-radius:4px}
.sb:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.sb-need{background:var(--m-need)}.sb-doing{background:var(--m-run)}.sb-check{background:var(--m-wait)}.sb-done{background:var(--m-ok)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.filters a{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none}
.filters a .swatch{width:8px;height:8px;border-radius:50%}
.filters a b{font-weight:600}
.filters a.hot{border-color:var(--pen);color:var(--pen)}
.filters a[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rows{margin:6px -16px 0;background:linear-gradient(90deg,transparent 27px,var(--margin) 27px,var(--margin) 28px,transparent 28px)}
.grp{margin:12px 16px 2px 40px;font-size:13px;font-weight:600;color:var(--ink2)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;min-height:44px;padding-right:16px;text-decoration:none;border-bottom:1px solid var(--rule)}
.row:hover{background:var(--sel)}
.row[aria-current]{background:var(--sel);box-shadow:inset 3px 0 0 var(--ink)}
.gut{display:flex;justify-content:center}
.sline{display:flex;align-items:center;gap:10px;min-width:0;padding:0 10px 0 12px}
.tname{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini{display:flex;flex:none;gap:2px;width:48px;height:6px}
.mini i{flex:1 1 0;border-radius:1px}
.rmeta{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.empty{margin:16px 16px 16px 40px;color:var(--ink2)}
.lfoot{margin:14px 0 4px;font-size:12.5px;color:var(--ink2)}
.lfoot summary{cursor:pointer}
.lfoot ul{margin:6px 0;padding-left:18px}
/* task */
.pick{color:var(--ink2);padding:40px 0;text-align:center}
.task{max-width:960px}
.thead h2{font-size:22px;line-height:1.25;font-weight:650;letter-spacing:-.01em;margin:2px 0 6px;overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 14px;font-size:13px;color:var(--ink2)}
.tmeta>span{display:inline-flex;align-items:center;gap:5px}
.four{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.blk{min-width:0;padding:12px 14px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.blk:nth-child(odd){border-right:1px solid var(--rule)}
.blk:nth-child(n+3){border-bottom:0}
.blk h3{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.blk.need{background:linear-gradient(90deg,var(--pen) 0,var(--pen) 3px,transparent 3px)}
.val{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:20px;font-weight:650;line-height:1.2}
.val small{font-size:14px;font-weight:500;color:var(--ink2)}
.one{margin:0 0 4px}
.clamp1{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.small{font-size:13px}
.mut{color:var(--ink2)}
.line{display:flex;align-items:center;gap:6px;margin:4px 0 0;font-size:13px;color:var(--ink2);min-width:0}
.line.run{color:var(--run)}
.bar{display:flex;gap:2px;margin:0 0 6px}
.bar i{flex:1 1 0;height:10px;border-radius:2px}
.bar i:first-child{border-top-left-radius:4px;border-bottom-left-radius:4px}
.bar i:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--fail)}
.dots i.used{background:var(--fail)}
.pulse{flex:none;width:8px;height:8px;border-radius:50%;background:var(--run);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.warn{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0;padding:2px 8px;border-radius:999px;font-size:12.5px;background:var(--wait-bg);color:var(--wait)}
.info{margin-top:4px;font-size:13px}
.info>summary{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--ink2);color:var(--ink2);font-size:12px;font-weight:700;font-style:italic;cursor:pointer;list-style:none}
.info>summary::-webkit-details-marker{display:none}
.info>div{margin-top:6px;padding:8px 10px;border-radius:6px;background:var(--idle-bg);color:var(--ink)}
.info p{margin:0 0 4px}
.opts{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 8px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px}
.opt .txt{min-width:0}
.opt b{display:block;font-size:13.5px}
.cons{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
.copy{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.more{margin-top:18px}
.more>h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.d{border-top:1px solid var(--rule)}
.d:last-child{border-bottom:1px solid var(--rule)}
.d>summary{display:flex;align-items:center;gap:10px;padding:9px 2px;cursor:pointer;list-style:none;font-weight:600}
.d>summary::-webkit-details-marker{display:none}
.d>summary::after{content:"";flex:none;width:7px;height:7px;margin-left:4px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s}
.d[open]>summary::after{transform:rotate(45deg)}
.d>summary>span:nth-of-type(2){flex:1 1 auto;min-width:0}
.cnt{font-size:12.5px;font-weight:400;color:var(--ink2);white-space:nowrap}
.dbody{min-width:0;padding:2px 2px 14px 28px;font-size:14px;overflow-wrap:anywhere}
.dbody ul,.dbody ol{margin:4px 0;padding-left:18px}
.dbody h4{margin:10px 0 4px;font-size:13.5px}
.scroll{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl th{font-weight:600;color:var(--ink2)}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.ms{display:flex;align-items:center;gap:8px;min-width:0;margin:0 0 6px}
.ms .clamp1{flex:1 1 auto}
.num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--rule);font-size:12px}
.chart{display:block;width:100%;height:auto;margin:6px 0 8px}
.chart text{fill:var(--ink2);font-size:11px;font-family:inherit}
.chart .base{stroke:var(--rule);stroke-width:1}
.cc-pass{fill:var(--m-ok)}.cc-fail{fill:var(--m-fail)}.cc-open{fill:var(--m-run)}
.cc-inconclusive{fill:var(--wait-bg);stroke:var(--m-wait);stroke-width:2}
.cc-lost,.cc-none{fill:none;stroke:var(--idle);stroke-width:1.5;stroke-dasharray:2 2}
.cc-x{stroke:var(--sheet);stroke-width:1.6}
.loop{list-style:none;padding-left:0!important}
.loop li{display:flex;align-items:center;gap:6px;margin:2px 0}
.loop li.fix{color:var(--ink2);padding-left:22px}
.loop li.last{color:var(--wait);font-weight:600}
.chg{margin:0 0 14px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:4px 0 10px}
.before,.after{min-width:0;padding:6px 8px;border-radius:6px;font-size:13.5px}
.before{background:var(--idle-bg);color:var(--ink2)}
.after{background:var(--ok-bg)}
.bl{display:block;margin:0 0 2px;font-size:12px;color:var(--ink2)}
.tl{list-style:none;margin:6px 0;padding:0;border-left:2px solid var(--rule)}
.tl li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:3px 0 3px 10px;font-size:13.5px}
.tl time{color:var(--ink2)}
.evl{list-style:none;padding:0!important}
.evl li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:13px}
.tag{padding:0 6px;border-radius:4px;background:var(--idle-bg);color:var(--ink2);font-size:12px}
.part{margin:0 0 8px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px}
.part p{margin:4px 0 0}
.part .ms{margin:0}
.lane{position:relative;height:10px;margin-top:6px;border-radius:3px;background:var(--idle-bg);overflow:hidden}
.lane i{position:absolute;top:0;bottom:0;border-radius:3px}
.s-execution{background:var(--m-run)}.s-reserved{background:var(--idle)}
.s-to_now{background:repeating-linear-gradient(90deg,var(--m-run) 0,var(--m-run) 4px,transparent 4px,transparent 7px)}
.honest{margin:0 0 8px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:8px;font-size:14px;background:var(--ink);color:var(--paper)}
/* view switch + dashboard */
.views{display:flex;flex:none;gap:2px;padding:2px;border:1px solid var(--rule);border-radius:8px}
.views a{padding:3px 10px;border-radius:6px;font-size:13.5px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.views a[aria-current]{background:var(--ink);color:var(--paper)}
#dashpane{display:none}
body.view-dash main{grid-template-columns:minmax(0,1fr)}
body.view-dash #listpane,body.view-dash #taskpane{display:none}
body.view-dash #dashpane{display:block}
.dash{max-width:1120px;margin:0 auto}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:2px 0 12px}
.dhead h2{margin:0;font-size:20px;font-weight:650}
.dash h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.dsec{margin:0 0 16px}
.panel{min-width:0;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.attn{display:flex;flex-wrap:wrap;gap:8px}
.attn a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);text-decoration:none;font-size:13.5px}
.attn a b{font-size:22px;line-height:1}
.attn a.hot{border-color:var(--pen);color:var(--pen)}
.attn a.zero{opacity:.55}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.ptile h3 a{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;text-decoration:none;min-width:0}
.ptile h3 a span:last-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.phead h3{flex:1 1 auto;min-width:0;margin:0}
.pneed{display:flex;flex:none;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.pneed b{font-size:24px;line-height:1;color:var(--ink)}
.pneed.has-need,.pneed.has-need b{color:var(--pen)}
.ptile .sbar{height:10px}
.pstats{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 10px}
.pstats a{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:6px;text-decoration:none;font-size:12.5px;color:var(--ink2)}
.pstats a:hover{background:var(--sel)}
.pstats b{display:flex;align-items:center;gap:3px;font-size:15px;color:var(--ink)}
.rhythm{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.rchart{display:block;width:100%;max-width:520px;height:auto}
.rchart text{fill:var(--ink2);font-size:9px;font-family:inherit}
.rchart .grid{stroke:var(--rule);stroke-width:.6}
.rc-pass{fill:var(--m-ok)}.rc-fail{fill:var(--m-fail)}.rc-inconclusive{fill:var(--wait-bg);stroke:var(--m-wait);stroke-width:1.2}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}
.rlegend li{display:flex;align-items:center;gap:6px}
.rlegend .swatch{width:12px;height:12px}
.sw-pass{background:var(--m-ok)}.sw-fail{background:var(--m-fail)}.sw-inconclusive{background:var(--wait-bg);box-shadow:inset 0 0 0 1.5px var(--m-wait)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.stat{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink2)}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 6px}
.counts span{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.counts b{font-size:18px;color:var(--ink)}
.ph{border-style:dashed;background:transparent;color:var(--ink2)}
.ph h3{display:flex;align-items:center;gap:6px}
.ph p{margin:0;font-size:13px}
@media (max-width:899px){
main{grid-template-columns:minmax(0,1fr)}
#listpane{border-right:0}
body.view-task #listpane{display:none}
body.view-list #taskpane{display:none}
#back{display:inline-block}
.blk.decision{grid-column:1/-1;border-right:0}
.rhythm{grid-template-columns:minmax(0,1fr)}
.ba{grid-template-columns:minmax(0,1fr)}

function safeId(id){return String(id==null?'':id).replace(/[^A-Za-z0-9-]/g,'')}
function merge(t,d){var o={},k;for(k in t)o[k]=t[k];if(d)for(k in d)if(d[k]!=null)o[k]=d[k];o.has_detail=!!d;return o}
function findTask(D,id){var want=safeId(id),t=itemsOf(D).filter(function(x){return safeId(x.id)===want})[0];return t?merge(t,obj(obj(D).details)[t.id]||null):null}
function readAt(D){return obj(D).read_at||obj(obj(D).overview).generated_at||null}
function sit(t){return obj(t.situation)}
function needsOf(t){return arr(t.needs_user).filter(function(n){return n&&OWNER_KINDS.indexOf(n.kind)>=0})}
function ownerNeeded(t){return sit(t).no_owner_decision===false||needsOf(t).length>0}
function isEngine(t){return obj(t.tracking).adapter==='engine'}
function groupOf(t){if(ownerNeeded(t))return 'need';var s=sit(t).stage;if(s==='done'||s==='closed')return 'done';if(s==='check'||s==='accept')return 'check';return 'doing'}
function tms(iso){var v=Date.parse(iso);return isNaN(v)?null:v}
function updatedAt(t){return obj(t.last_update).at||t.created_at||null}
function orderTasks(list){return list.map(function(t,i){return [t,i]}).sort(function(a,b){var o=(ownerNeeded(b[0])?1:0)-(ownerNeeded(a[0])?1:0);if(o)return o;
  var u=(tms(updatedAt(b[0]))||0)-(tms(updatedAt(a[0]))||0);return u||a[1]-b[1]}).map(function(x){return x[0]})}
function isIdle(t,now){var s=sit(t).stage,a=since(updatedAt(t),now||new Date().toISOString());return s!=='done'&&s!=='closed'&&a!=null&&a>IDLE_DAYS*86400}
function matches(t,f,now){if(f==='all')return true;if(f==='fail')return stateKey(t)==='fix';if(f==='timeout')return stateKey(t)==='inconclusive';if(f==='recheck')return stateKey(t)==='recheck';
  if(f==='issue')return ['fix','inconclusive','recheck'].indexOf(stateKey(t))>=0;if(f==='idle')return isIdle(t,now);return groupOf(t)===f}
function filterTasks(list,f,now){f=FILTER_KEYS.indexOf(f)>=0?f:'all';return orderTasks(list.filter(function(t){return matches(t,f,now)}))}
function projKey(p){return projName(p).toLowerCase().replace(/[^a-z0-9]/g,'')||'x'}
function inProject(t,key){return !key||projKey(t.project)===key}
function countTasks(list){var c={all:list.length,need:0,doing:0,check:0,done:0};list.forEach(function(t){c[groupOf(t)]++});return c}

// ---- words and marks ----
function stateKey(t){if(ownerNeeded(t))return 'need';var s=sit(t),st=s.stage;
  if(st==='check'&&s.label==='Cần kiểm lại')return 'recheck';if(st==='check'&&s.label==='Chưa kết luận')return 'inconclusive';
  if(st==='accept')return 'check';return STATE_ICONS[st]?st:'unknown'}
function toneOf(t){return STATE_ICONS[stateKey(t)].tone}
function statusLine(t){if(ownerNeeded(t)){var k=(needsOf(t)[0]||{}).kind;return k==='approve'?'Cần bạn duyệt':k==='accept'?'Cần bạn nghiệm thu':'Cần bạn quyết'}return sit(t).label||'Chưa xác định'}
function stateIcon(t,size){var s=STATE_ICONS[stateKey(t)];return icon(s.icon,statusLine(t),s.tone,size)}
function whoOf(t){var s=sit(t);if(!s.next)return null;return s.next_by==='owner'?'Bạn':s.next_by==='checker'?'Bộ kiểm':s.next_by==='assigned'?'AI':'Chưa rõ'}
function titleOf(t){return t.short_title||t.headline||t.title||t.plan||'Việc không tên'}
function projName(p){var s=String(p||'').replace(/[\\\/]+$/,'');return s.split(/[\\\/]/).pop()||s}
function needsProject(list){var s={};list.forEach(function(t){s[String(t.project||'').toLowerCase()]=1});return Object.keys(s).length>1}
// milestone ids become their position ("mốc M3" -> "mốc 3"): ids are internal codes, the position is what the owner sees in the bar
function msRows(t){var r=arr(obj(t.milestone_checks).rows);if(r.length)return r;
  return arr(t.milestones).map(function(m){var st=m.state==='passed'&&(m.stale||m.needs_recheck)?'recheck':(m.state==='failed'&&m.result==='inconclusive'?'inconclusive':m.state);
    return {id:m.id,title:m.title,state:st,label:MS_LABEL[st]||st,reason:m.reason||null,note:m.note||null,checks:[],failures:0}})}
function msIndex(t){var m={};msRows(t).forEach(function(r,i){if(r&&r.id)m[r.id]=i+1});return m}
function human(text,t){var m=msIndex(t),swap=function(all,pre,list,post){return pre+list.replace(/[A-Za-z0-9_-]+/g,function(id){return m[id]?String(m[id]):id})+(post||'')};
  return String(text==null?'':text).replace(/(mốc\s+)([A-Za-z0-9_-]+(?:(?:,\s*|\s+và\s+)[A-Za-z0-9_-]+)*)()/gi,swap).replace(/(mốc[^()]{0,40}\()([^()]*)(\))/gi,swap)}
function humanEvent(text,t){return human(String(text||'').replace(/\bverdict\b/g,'kết quả kiểm').replace(/: pass\b/g,': đạt').replace(/: fail\b/g,': không đạt').replace(/: inconclusive\b/g,': chưa kết luận'),t)}
function pad(n){return (n<10?'0':'')+n}
function fmtTime(iso){var v=tms(iso);if(v==null)return '';var d=new Date(v);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dur(sec){if(typeof sec!=='number'||!isFinite(sec)||sec<0)return '';var m=Math.round(sec/60);if(m<1)return Math.max(1,Math.round(sec))+' giây';if(m<60)return m+' phút';
  var h=Math.floor(m/60),r=m%60;if(h<24)return h+' giờ'+(r?' '+r+' phút':'');var d=Math.floor(h/24),hh=h%24;return d+' ngày'+(hh?' '+hh+' giờ':'')}
function since(a,b){var x=tms(a),y=tms(b);return x==null||y==null?null:Math.max(0,(y-x)/1000)}
function agoShort(iso,now){var s=since(iso,now);if(s==null)return '';if(s<60)return 'vừa xong';return dur(s).split(' ').slice(0,2).join(' ')}
function ago(iso,now){var a=agoShort(iso,now);return !a||a==='vừa xong'?a:a+' trước'}

// ---- segments: milestones of a plain plan, parts of an engine plan ----
function nodeTone(n){n=obj(n);return (n.state==='verified'||n.state==='accepted')?'ok':n.phase==='held'||n.verification_result==='fail'?'fail':n.state==='produced'?'wait':n.phase==='running'?'run':'idle'}
function nodeWord(n){return {ok:'Đã kiểm đạt',fail:'Bị giữ hoặc không đạt',wait:'Có đầu ra, chờ kiểm',run:'Đang chạy',idle:'Chưa bắt đầu'}[nodeTone(n)]}
var NODE_SEG={ok:'ok',fail:'fail',wait:'wait',run:'run',idle:'pending'};
var NODE_ICON={ok:'ok',fail:'cross',wait:'shield',run:'play',idle:'todo'};
function segmentsOf(t){
  if(isEngine(t)&&!Object.keys(obj(t.nodes)).length){var ns=obj(t.nodes_summary),out=[];   // the list has only the counts of the parts
    [['ok',(ns.verified||0)+(ns.accepted||0),'Đã kiểm đạt'],['wait',ns.produced||0,'Có đầu ra, chờ kiểm'],['run',ns.running||0,'Đang chạy'],['fail',ns.held||0,'Bị giữ'],['pending',ns.pending||0,'Chưa bắt đầu']]
      .forEach(function(x){for(var i=0;i<x[1];i++)out.push({seg:x[0],label:'Phần việc: '+x[2]})});return out}
  if(isEngine(t)){var nodes=obj(t.nodes);return Object.keys(nodes).map(function(k){var tone=nodeTone(nodes[k]);return {seg:NODE_SEG[tone],label:(obj(t.node_titles)[k]||k)+': '+nodeWord(nodes[k])}})}
  return msRows(t).map(function(r,i){return {seg:MS_SEG[r.state]||'pending',label:'Mốc '+(i+1)+': '+(r.title||'')+', '+(MS_LABEL[r.state]||r.state)}})}
function segBar(t,cls){var s=segmentsOf(t);if(!s.length)return '';
  return '<span class="'+cls+'" role="img" aria-label="'+esc(tallyText(t))+'">'+s.map(function(x){return '<i class="seg-'+x.seg+'" title="'+esc(x.label)+'"></i>'}).join('')+'</span>'}
function msTally(t){var rows=msRows(t),s=obj(sit(t).milestones);var passed=typeof s.passed==='number'?s.passed:rows.filter(function(r){return r.state==='passed'}).length;return {passed:passed,total:rows.length}}
function tally(t){if(isEngine(t)){var nodes=obj(t.nodes),ids=Object.keys(nodes),ns=obj(t.nodes_summary);
    return {passed:ids.length?ids.filter(function(k){return nodeTone(nodes[k])==='ok'}).length:(ns.verified||0)+(ns.accepted||0),total:ids.length||ns.total||0,unit:'phần'}}
  var c=msTally(t);c.unit='mốc';return c}
function tallyText(t){var c=tally(t);return c.passed+'/'+c.total+' '+c.unit+' đạt'}

// ---- routing: plain hash names only (#tong-quan, #viec, #viec-<filter>, #viec-<filter>-<id>, with -duan-<project> after the filter) ----
// the dashboard is the landing page: the owner judges at a glance first, then opens the list
function routeOf(h){h=String(h||'').replace(/^#/,'');if(h==='tong-quan'||h==='')return {view:'dash'};
  var m=/^viec(?:-([a-z]+))?(?:-duan-([a-z0-9]+))?(?:-([A-Za-z0-9-]+))?$/.exec(h);if(!m)return {view:'dash'};
  var f=FILTER_KEYS.indexOf(m[1])>=0?m[1]:'all',r=m[3]?{view:'task',filter:f,id:m[3]}:{view:'list',filter:f,id:null};if(m[2])r.project=m[2];return r}
function hrefOf(r){if(r.view==='dash')return '#tong-quan';var f=FILTER_KEYS.indexOf(r.filter)>=0?r.filter:'all',p=r.project?'-duan-'+projKeyOf(r.project):'';
  return r.view==='task'&&r.id?'#viec-'+f+p+'-'+safeId(r.id):'#viec-'+f+p}
function projKeyOf(k){return String(k).toLowerCase().replace(/[^a-z0-9]/g,'')}
function listKeyOf(r){return (r.filter||'all')+(r.project?'-duan-'+r.project:'')}
function bodyClass(r){return 'view-'+(r.view==='task'?'task':r.view==='dash'?'dash':'list')}
function listStateKey(f){return 'ui33-list-'+f}
function saveListState(store,f,top){try{store.setItem(listStateKey(f),String(Math.round(top||0)))}catch(e){}}
function loadListState(store,f){var top=0;try{var v=store.getItem(listStateKey(f));top=v==null?0:(parseInt(v,10)||0)}catch(e){top=0}return {filter:f,scrollTop:top}}

// ---- list ----
function hostItems(D){var out=[];arr(obj(obj(D).host_work).projects).forEach(function(p){arr(obj(obj(p).view).items).forEach(function(i){out.push(i)})});return out}
function hooksSeen(D){return arr(obj(obj(D).host_work).projects).some(function(p){return arr(obj(obj(p).view).hooks_seen).length>0})}
function planTitle(D,plan){var t=itemsOf(D).filter(function(x){return x.plan===plan})[0];return t?titleOf(t):null}
var HOST_TONE={running:'run',finished:'ok',waiting:'wait',unknown:'unknown'},HOST_ICON={running:'play',finished:'ok',waiting:'hourglass',unknown:'question'};
function hostLine(D,i){var o=obj(i.onecrew),owner=o.bound?planTitle(D,o.plan):null;
  return '<li class="host-item" data-host-state="'+esc(i.state)+'">'+icon(HOST_ICON[i.state]||'question',i.state_label||i.state,HOST_TONE[i.state]||'unknown','sm')+icon(i.kind==='subagent'?'robot':'code',i.kind==='subagent'?'Agent phụ':'Lệnh nền',null,'sm')
    +'<span>'+esc(i.summary||'không có mô tả')+(i.started_at?' <span class="mut">'+esc(fmtTime(i.started_at))+'</span>':'')+(owner?' <span class="mut">(“'+esc(owner)+'”)</span>':o.bound?'':' <span class="mut">(ngoài hợp đồng)</span>')+'</span></li>'}
function hostSummary(D){var items=hostItems(D),c={running:0,waiting:0,finished:0,unknown:0};items.forEach(function(i){c[i.state]=(c[i.state]||0)+1});
  var line=!obj(D).host_work?'chưa đọc được':!items.length?(hooksSeen(D)?'không thấy việc nào':'hook chưa báo tín hiệu nào')
    :[c.running?c.running+' đang chạy':'',c.waiting?c.waiting+' đang chờ':'',c.finished?c.finished+' đã xong':'',c.unknown?c.unknown+' chưa rõ':''].filter(Boolean).join(', ');
  return {counts:c,items:items,line:line}}
function hostBadge(D){var h=hostSummary(D),label='Agent và việc nền: '+h.line,un={};
  arr(obj(D.host_work).projects).forEach(function(p){arr(obj(p.view).unobserved).forEach(function(x){un[x]=1})});
  var body=(h.items.length?'<ul>'+h.items.map(function(i){return hostLine(D,i)}).join('')+'</ul>':'<p>'+esc(h.line)+'. Không có dòng nào không có nghĩa là không có việc nền.</p>')
    +'<p class="mut small">'+esc(obj(D.host_work).note||'')+'</p>'+(Object.keys(un).length?'<p class="small">Chưa thấy được:</p><ul class="small mut">'+Object.keys(un).slice(0,8).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'');
  return '<details class="badge" id="hostbox"><summary aria-label="'+esc(label)+'" title="'+esc(label)+'">'+icon('robot',null,h.counts.running?'run':'idle')
    +(h.items.length?'<b>'+h.counts.running+'</b>':'<b class="mut">?</b>')+'</summary><div class="badge-body">'+body+'</div></details>'}
function resSummary(D){var rs=obj(obj(D).shared_resources),held=arr(rs.resources).filter(function(r){return !r.free}).length,wait=0;arr(rs.resources).forEach(function(r){wait+=arr(r.waiters).length});
  return {held:held,wait:wait,line:!D.shared_resources?'chưa đọc được':rs.error?'không đọc được':!rs.declared?'máy chưa khai báo':held?held+' đang được giữ'+(wait?', '+wait+' đang chờ':''):'đều trống'}}
function resBadge(D){var rs=obj(obj(D).shared_resources),s=resSummary(D),label='Tài nguyên dùng chung: '+s.line;
  var body=rs.error?'<p>'+esc(rs.error)+'</p>':arr(rs.resources).length?'<ul>'+arr(rs.resources).map(function(r){return '<li>'+icon(r.free?'ok':'lock',r.state_label,r.free?'ok':'run','sm')+'<span>'+esc(r.resource)
    +arr(r.holders).map(function(h){return ', giữ bởi “'+esc(planTitle(D,h.plan)||h.plan||'chưa rõ')+'”'}).join('')+(arr(r.waiters).length?', '+arr(r.waiters).length+' việc chờ':'')+'</span></li>'}).join('')+'</ul>'
    :'<p>'+esc(rs.empty_note||s.line)+'</p>';
  return '<details class="badge" id="resbox"><summary aria-label="'+esc(label)+'" title="'+esc(label)+'">'+icon('lock',null,s.held?'run':'idle')
    +(rs.declared?'<b>'+s.held+'</b>':'<b class="mut">'+(D.shared_resources?'–':'?')+'</b>')+'</summary><div class="badge-body">'+body+'<p class="mut small">'+esc(rs.note||'')+'</p></div></details>'}
function summaryBar(c,proj){return '<div class="sbar" role="img" aria-label="'+esc(FILTERS.slice(0,4).map(function(f){return f[1]+' '+c[f[0]]}).join(', '))+'">'
  +FILTERS.slice(0,4).filter(function(f){return c[f[0]]>0}).map(function(f){return '<a class="sb sb-'+GROUP_SEG[f[0]]+'" href="'+hrefOf({view:'list',filter:f[0],project:proj})+'" data-group="'+f[0]+'" data-count="'+c[f[0]]+'" style="flex-grow:'+c[f[0]]+'" title="'+f[1]+': '+c[f[0]]+'" aria-label="'+f[1]+': '+c[f[0]]+'"></a>'}).join('')+'</div>'}
function rowHtml(t,filter,multi,now,sel,proj){
  return '<a class="row" href="'+hrefOf({view:'task',filter:filter,id:t.id,project:proj})+'" data-id="'+esc(safeId(t.id))+'" data-state="'+stateKey(t)+'"'+(sel&&safeId(sel)===safeId(t.id)?' aria-current="page"':'')+' title="'+esc((t.headline||titleOf(t))+(multi?' ('+projName(t.project)+')':''))+'"'+(multi?' data-proj="'+esc(projName(t.project))+'"':'')+'>'
    +'<span class="gut">'+stateIcon(t)+'</span><span class="sline"><span class="tname">'+esc(titleOf(t))+'</span>'+segBar(t,'mini')+'</span>'
    +'<span class="rmeta"><time title="'+esc(fmtTime(updatedAt(t)))+'">'+esc(agoShort(updatedAt(t),now))+'</time></span></a>'}
function renderList(D,filter,sel,proj){filter=FILTER_KEYS.indexOf(filter)>=0?filter:'all';proj=proj||null;
  var now=readAt(D),all=itemsOf(D).filter(function(t){return inProject(t,proj)}),c=countTasks(all),list=filterTasks(all,filter,now),multi=needsProject(all),ov=obj(obj(D).overview);
  var h='<div class="glance"><div class="hero'+(c.need?' has-need':'')+'">'+(c.need?icon('need',null,'need','lg')+'<span><b>'+c.need+'</b> việc cần bạn</span>':icon('ok',null,'ok','lg')+'<span><b>0</b> việc cần bạn</span>')+'</div>'
    +'<div class="badges">'+hostBadge(D)+resBadge(D)+'</div></div>';
  h+=summaryBar(c,proj);
  h+='<nav class="filters" aria-label="Lọc việc">'+FILTERS.map(function(f){return '<a href="'+hrefOf({view:'list',filter:f[0],project:proj})+'" data-filter="'+f[0]+'"'+(f[0]===filter?' aria-current="true"':'')
    +(f[0]==='need'&&c.need?' class="hot"':'')+'>'+(f[0]==='all'?icon('list',null,null,'sm'):'<span class="swatch sb-'+GROUP_SEG[f[0]]+'"></span>')+f[1]+' <b>'+c[f[0]]+'</b></a>'}).join('')
    +(EXTRA_FILTERS[filter]?'<a href="'+hrefOf({view:'list',filter:filter,project:proj})+'" data-filter="'+filter+'" aria-current="true">'+esc(EXTRA_FILTERS[filter])+' <b>'+list.length+'</b></a><a href="'+hrefOf({view:'list',filter:'all',project:proj})+'" aria-label="Bỏ lọc '+esc(EXTRA_FILTERS[filter])+'" title="Bỏ lọc">×</a>':'')
    +(proj?'<a href="'+hrefOf({view:'list',filter:filter})+'" class="projchip" data-project="'+esc(proj)+'" aria-label="Bỏ lọc dự án" title="Bỏ lọc dự án">'+icon('box',null,null,'sm')+esc(projName((all[0]||{}).project)||proj)+' ×</a>':'')+'</nav>';
  var owners=list.filter(ownerNeeded),rest=list.filter(function(t){return !ownerNeeded(t)});
  h+='<div class="rows">';
  if(!list.length)h+='<p class="empty">Không có việc nào trong mục này.</p>';
  if(owners.length&&filter!=='need')h+='<h3 class="grp">Cần bạn</h3>';
  h+=owners.map(function(t){return rowHtml(t,filter,multi,now,sel,proj)}).join('');
  if(owners.length&&rest.length)h+='<h3 class="grp">Các việc khác</h3>';
  h+=rest.map(function(t){return rowHtml(t,filter,multi,now,sel,proj)}).join('')+'</div>';
  var cov=obj(ov.coverage);
  h+='<details class="lfoot"><summary>'+all.length+' việc, đọc lúc '+esc(fmtTime(now))+' (i)</summary><ul>'+['milestones','engine','external'].filter(function(k){return cov[k]}).map(function(k){return '<li>'+esc(cov[k])+'</li>'}).join('')
    +'<li>Chỉ đọc: trang không duyệt, không trả lời, không dừng hay tiếp tục việc. Nút sao chép chỉ chép mẫu lệnh.</li></ul></details>';
  return h}
function legendHtml(){var li=function(i,l){return '<li>'+i+'<span>'+esc(l)+'</span></li>'};
  return '<h4>Trạng thái việc</h4><ul>'+STATE_KEYS.map(function(k){var s=STATE_ICONS[k];return li(icon(s.icon,null,s.tone),s.label)}).join('')+'</ul>'
    +'<h4>Ai làm bước tiếp</h4><ul>'+Object.keys(WHO_ICONS).map(function(k){return li(icon(WHO_ICONS[k].icon,null,WHO_ICONS[k].tone),k)}).join('')+'</ul>'
    +'<h4>Thanh mốc</h4><ul>'+Object.keys(MS_SEG).map(function(k){return li('<span class="swatch seg-'+MS_SEG[k]+'"></span>',MS_LABEL[k])}).join('')+'</ul>'
    +'<h4>Lần kiểm trên biểu đồ</h4><ul>'+li('<span class="swatch seg-ok"></span>','Đạt: khối đặc')+li('<span class="swatch seg-fail"></span>','Không đạt: khối có dấu ×')+li('<span class="swatch seg-inconclusive"></span>','Chưa kết luận: khối rỗng viền vàng')+'</ul>'}

// ---- dashboard: quick assessment from the same data (no new source) ----
function projectsOf(D){var seen={},out=[];itemsOf(D).forEach(function(t){var k=projKey(t.project);if(!seen[k]){seen[k]={key:k,name:projName(t.project),path:t.project,tasks:[]};out.push(seen[k])}seen[k].tasks.push(t)});return out}
var PTILE=[['doing','Đang làm','play','run'],['issue','Có vấn đề','warn','fail'],['done','Xong','ok','ok']];
function projectTile(D,p,now){var need=filterTasks(p.tasks,'need',now).length;
  return '<article class="panel ptile" data-project="'+esc(p.key)+'"><div class="phead"><h3><a href="'+hrefOf({view:'list',filter:'all',project:p.key})+'" title="'+esc(p.path)+'">'+icon('box',null,null,'sm')+'<span>'+esc(p.name)+'</span></a></h3>'
    +'<a class="pneed'+(need?' has-need':'')+'" href="'+hrefOf({view:'list',filter:'need',project:p.key})+'" data-f="need" data-count="'+need+'" aria-label="Cần bạn: '+need+'" title="Cần bạn: '+need+'">'+icon(need?'need':'ok',null,need?'need':'ok')+'<b>'+need+'</b><span>cần bạn</span></a></div>'
    +summaryBar(countTasks(p.tasks),p.key)
    +'<ul class="pstats">'+PTILE.map(function(x){var n=filterTasks(p.tasks,x[0],now).length;

function dayKey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

  days.forEach(function(d,i){var x=L+i*slot+(slot-bw)/2,base=y(0),gx='';

  document.addEventListener('click',function(e){var c=e.target.closest('[data-copy]');if(c){copyText(c.getAttribute('data-copy'));return}
    if(e.target.closest('#back')){var r=routeOf(location.hash);if(fromList){fromList=false;history.back()}else location.hash=hrefOf({view:'list',filter:r.filter,project:r.project});return}
    if(e.target.closest('#theme')){var now=root.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),next=now==='dark'?'light':'dark';
      root.setAttribute('data-theme',next);try{window.localStorage.setItem('ui33-theme',next)}catch(err){}return}
    if(e.target.closest('#legend-btn')){setLegend(legend.hidden);return}
    if(!legend.hidden&&!e.target.closest('#legend'))setLegend(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!legend.hidden){setLegend(false);lbtn.focus()}});
  window.addEventListener('hashchange',render);
  render()}
if(typeof document!=='undefined')wire();
</script>
</body></html>
