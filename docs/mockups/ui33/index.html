<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công việc OneCrew</title>
<style>
:root{--paper:#F6F8FB;--sheet:#FFFFFF;--ink:#1D2840;--ink2:#566179;--rule:#DCE3EC;--margin:#EDB1BA;--sel:#EAF0FA;--pen:#C01F3C;--pen-bg:#FBE9EC;--ok:#21784A;--ok-bg:#E5F2EA;--run:#2457A6;--run-bg:#E7EEF9;--wait:#9A6210;--wait-bg:#FAF0DC;--fail:#BF420F;--fail-bg:#FBEBE2;--idle:#7F889C;--idle-bg:#EDF0F4;--focus:#2457A6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#141B27;--sheet:#1B2433;--ink:#E4E9F2;--ink2:#A2ACC0;--rule:#2B3547;--margin:#7A3B47;--sel:#22314A;--pen:#FF7088;--pen-bg:#3A1F28;--ok:#5FC68E;--ok-bg:#1C3328;--run:#86ABF2;--run-bg:#1E2B45;--wait:#E5B65C;--wait-bg:#3A2F1A;--fail:#F58C5E;--fail-bg:#3B2419;--idle:#8E97AB;--idle-bg:#263042;--focus:#86ABF2;color-scheme:dark}}
:root[data-theme=dark]{--paper:#141B27;--sheet:#1B2433;--ink:#E4E9F2;--ink2:#A2ACC0;--rule:#2B3547;--margin:#7A3B47;--sel:#22314A;--pen:#FF7088;--pen-bg:#3A1F28;--ok:#5FC68E;--ok-bg:#1C3328;--run:#86ABF2;--run-bg:#1E2B45;--wait:#E5B65C;--wait-bg:#3A2F1A;--fail:#F58C5E;--fail-bg:#3B2419;--idle:#8E97AB;--idle-bg:#263042;--focus:#86ABF2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.brand{font-weight:700;letter-spacing:-.01em}
.htitle{color:var(--ink2)}
.srcbadge{margin-left:auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--wait-bg);color:var(--wait);border:1px dashed var(--wait)}
.srcbadge.real{background:var(--ok-bg);color:var(--ok);border-style:solid}
#theme{flex:none;font:inherit;font-size:13px;padding:3px 9px;border-radius:6px;border:1px solid var(--rule);background:transparent;color:var(--ink2);cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);height:calc(100vh - 48px);height:calc(100dvh - 48px)}
.pane{overflow:auto;min-width:0;padding:12px 16px}
#listpane{border-right:1px solid var(--rule)}
#back{display:none;font:inherit;font-size:14px;padding:4px 10px;margin:0 0 8px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
/* state marks: shape and colour carry the state, the chip carries the word */
.mk{flex:none;display:inline-block;width:12px;height:12px}
.mk-ok{border-radius:50%;background:var(--ok)}
.mk-run{border-radius:50%;background:linear-gradient(90deg,var(--run) 50%,transparent 50%);box-shadow:inset 0 0 0 2px var(--run)}
.mk-idle{border-radius:50%;box-shadow:inset 0 0 0 2px var(--idle)}
.mk-wait{border-radius:50%;border:2px dashed var(--wait)}
.mk-fail{background:var(--fail);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk-need{width:10px;height:10px;margin:1px;background:var(--pen);transform:rotate(45deg)}
.mk-stop{border-radius:2px;background:var(--pen)}
.mk-closed{border-radius:2px;background:var(--idle)}
.mk-unknown{border-radius:50%;border:2px dotted var(--idle)}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.55;padding:0 8px;border-radius:999px;white-space:nowrap;background:var(--idle-bg);color:var(--ink2)}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-run{background:var(--run-bg);color:var(--run)}.c-wait{background:var(--wait-bg);color:var(--wait)}
.c-fail{background:var(--fail-bg);color:var(--fail)}.c-need,.c-stop{background:var(--pen-bg);color:var(--pen)}.c-idle,.c-closed,.c-unknown{background:var(--idle-bg);color:var(--ink2)}
.x-ok{color:var(--ok)}.x-run{color:var(--run)}.x-wait{color:var(--wait)}.x-fail{color:var(--fail)}.x-need,.x-stop{color:var(--pen)}.x-idle,.x-closed,.x-unknown{color:var(--ink2)}
/* list */
.hero{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;margin:2px 0 12px}
.hero b{font-size:26px;line-height:1}
.hero.has-need{color:var(--pen)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters a{font-size:13.5px;padding:3px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none}
.filters a b{font-weight:600;color:var(--ink2)}
.filters a.hot{border-color:var(--pen);color:var(--pen)}
.filters a[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters a[aria-current] b{color:inherit}
.strip{font-size:13.5px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);margin:0 0 8px}
.strip>summary{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;list-style:none;min-width:0}
.strip>summary::-webkit-details-marker{display:none}
.strip>summary span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.strip-body{padding:6px 10px 10px;border-top:1px solid var(--rule);overflow-wrap:anywhere}
.strip-body ul{margin:4px 0;padding-left:18px}
.rows{margin:6px -16px 0;background:linear-gradient(90deg,transparent 27px,var(--margin) 27px,var(--margin) 28px,transparent 28px)}
.grp{margin:12px 16px 2px 40px;font-size:13px;font-weight:600;color:var(--ink2)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;min-height:44px;padding-right:16px;text-decoration:none;border-bottom:1px solid var(--rule)}
.row:hover{background:var(--sel)}
.row[aria-current]{background:var(--sel);box-shadow:inset 3px 0 0 var(--ink)}
.gut{display:flex;justify-content:center}
.sline{display:flex;align-items:center;gap:8px;min-width:0;padding:0 8px 0 12px}
.tname{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rmeta{display:flex;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.empty{margin:16px 16px 16px 40px;color:var(--ink2)}
.lfoot{margin:14px 0 4px;font-size:12.5px;color:var(--ink2)}
.lfoot summary{cursor:pointer}
.lfoot ul{margin:6px 0;padding-left:18px}
/* task */
.pick{color:var(--ink2);padding:40px 0;text-align:center}
.task{max-width:960px}
.thead h2{font-size:22px;line-height:1.25;font-weight:650;letter-spacing:-.01em;margin:2px 0 6px;overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;color:var(--ink2)}
.four{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.blk{min-width:0;padding:14px 16px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.blk:nth-child(odd){border-right:1px solid var(--rule)}
.blk:nth-child(n+3){border-bottom:0}
.blk h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.blk.need{background:linear-gradient(90deg,var(--pen) 0,var(--pen) 3px,transparent 3px)}
.big{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:18px;font-weight:600}
.one{margin:0 0 6px}
.strong{font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.small{font-size:13px}
.mut{color:var(--ink2)}
.tally{display:flex;align-items:baseline;gap:6px;margin:0 0 6px}
.tally b{font-size:22px;line-height:1}
.bar{display:flex;gap:3px;margin:0 0 10px}
.bar i{flex:1 1 0;height:8px;border-radius:2px;background:var(--idle-bg)}
.b-ok{background:var(--ok)!important}.b-run{background:var(--run)!important}.b-fail{background:var(--fail)!important}.b-stop{background:var(--pen)!important}
.b-wait{background:repeating-linear-gradient(45deg,var(--wait) 0,var(--wait) 3px,var(--wait-bg) 3px,var(--wait-bg) 6px)!important}
.b-unknown{background:repeating-linear-gradient(90deg,var(--idle) 0,var(--idle) 2px,transparent 2px,transparent 5px)!important}
.who{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13.5px}
.act{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.act.run{color:var(--run)}
.pulse{flex:none;width:8px;height:8px;border-radius:50%;background:var(--run);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.warn{display:flex;align-items:flex-start;gap:8px;margin:8px 0 0;padding:6px 8px;border-radius:6px;font-size:13.5px;background:var(--wait-bg);color:var(--wait)}
.warn .mk{margin-top:4px}
.opts{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:8px}
.opt{display:grid;gap:4px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px}
.cons{font-size:13px;color:var(--ink2)}
.copy{justify-self:start;font:inherit;font-size:13px;padding:3px 10px;border-radius:6px;border:1px solid var(--ink2);background:transparent;color:var(--ink);cursor:pointer}
.more{margin-top:18px}
.more>h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.d{border-top:1px solid var(--rule)}
.d:last-child{border-bottom:1px solid var(--rule)}
.d>summary{display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer;list-style:none;font-weight:600}
.d>summary::-webkit-details-marker{display:none}
.d>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s}
.d[open]>summary::before{transform:rotate(45deg)}
.cnt{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--ink2);white-space:nowrap}
.dbody{min-width:0;padding:2px 2px 14px 19px;font-size:14px;overflow-wrap:anywhere}
.dbody ul,.dbody ol{margin:4px 0;padding-left:18px}
.dbody h4{margin:10px 0 4px;font-size:13.5px}
.scroll{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl th{font-weight:600;color:var(--ink2)}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.ms{margin:0 0 14px}
.mshead{display:flex;align-items:center;gap:8px;min-width:0}
.mshead .clamp{flex:1 1 auto;min-width:0}
.num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--rule);font-size:12px}
.sq{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 6px 28px}
.sq i{width:10px;height:10px;border-radius:2px;background:var(--idle-bg)}
.loop li.fix{color:var(--ink2);list-style:circle}
.loop li.last{color:var(--wait);font-weight:600}
.chg{margin:0 0 14px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:4px 0 10px}
.before,.after{min-width:0;padding:6px 8px;border-radius:6px;font-size:13.5px}
.before{background:var(--idle-bg);color:var(--ink2)}
.after{background:var(--ok-bg)}
.bl{display:block;margin:0 0 2px;font-size:12px;color:var(--ink2)}
.tl{list-style:none;margin:6px 0;padding:0;border-left:2px solid var(--rule)}
.tl li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:3px 0 3px 10px;font-size:13.5px}
.tl time{color:var(--ink2)}
.part{margin:0 0 8px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px}
.part p{margin:4px 0 0}
.lane{position:relative;height:10px;margin-top:6px;border-radius:3px;background:var(--idle-bg);overflow:hidden}
.lane i{position:absolute;top:0;bottom:0;border-radius:3px}
.s-execution{background:var(--run)}.s-reserved{background:var(--idle)}
.s-to_now{background:repeating-linear-gradient(90deg,var(--run) 0,var(--run) 4px,transparent 4px,transparent 7px)}
.honest{margin:0 0 8px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:8px;font-size:14px;background:var(--ink);color:var(--paper)}
@media (max-width:899px){
main{grid-template-columns:minmax(0,1fr)}
#listpane{border-right:0}
body.view-task #listpane{display:none}
body.view-list #taskpane{display:none}
#back{display:inline-block}
header .htitle{display:none}
.four{grid-template-columns:minmax(0,1fr)}
.four>.blk{border-right:0;border-bottom:1px solid var(--rule)}
.four>.blk:last-child{border-bottom:0}
.ba{grid-template-columns:minmax(0,1fr)}
.kv{grid-template-columns:minmax(0,1fr)}
.kv dd{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
var FILTERS=[['need','Cần bạn'],['doing','Đang làm'],['check','Chờ kiểm'],['done','Xong'],['all','Tất cả']];
var FILTER_KEYS=FILTERS.map(function(f){return f[0]});
var OWNER_KINDS=['approve','request','accept','stopped'];
var BETWEEN_CHECKS='Kế hoạch theo mốc: trang chỉ thấy các lần kiểm, không thấy agent làm gì giữa hai lần kiểm.';
var SECTIONS=[['scope','Yêu cầu và phạm vi'],['checks','Mốc và lần kiểm'],['repair','Vòng sửa'],['plan','Thay đổi kế hoạch'],['wait','Thời gian và ai chờ ai'],
  ['evidence','Bằng chứng'],['agents','Agent và việc nền'],['res','Tài nguyên dùng chung'],['tech','Mã kỹ thuật']];
var MS_LABEL={passed:'Đạt',failed:'Không đạt',recheck:'Cần kiểm lại',checking:'Đang kiểm',pending:'Chưa kiểm',stopped:'Đã dừng',inconclusive:'Chưa kết luận',unknown:'Chưa xác định bản hiện tại'};
var MS_TONE={passed:'ok',failed:'fail',recheck:'wait',checking:'run',pending:'idle',stopped:'stop',inconclusive:'wait',unknown:'unknown'};
var VALID_TONE={valid:'ok',accepted:'ok',recheck:'wait',inconclusive:'wait',not_compared:'wait',failed:'fail',unknown:'unknown',none:'idle',parts:'wait'};
var RESULT_WORD={pass:'Đạt',fail:'Không đạt',inconclusive:'Chưa kết luận'};
var WHO_TONE={'Bạn':'need','AI':'run','Bộ kiểm':'run','Chưa rõ':'unknown'};

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(v){return Array.isArray(v)?v:[]}
function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}

// ---- data: overview items (+ detail of the same root) in the shape of tracking.overview / tracking.detail ----
function itemsOf(D){var out=[];arr(obj(obj(D).overview).projects).forEach(function(p){arr(obj(p).tasks).forEach(function(t){if(t&&t.id)out.push(t)})});return out}
function safeId(id){return String(id==null?'':id).replace(/[^A-Za-z0-9-]/g,'')}
function merge(t,d){var o={},k;for(k in t)o[k]=t[k];if(d)for(k in d)if(d[k]!=null)o[k]=d[k];o.has_detail=!!d;return o}
function findTask(D,id){var want=safeId(id),t=itemsOf(D).filter(function(x){return safeId(x.id)===want})[0];return t?merge(t,obj(obj(D).details)[t.id]||null):null}
function readAt(D){return obj(D).read_at||obj(obj(D).overview).generated_at||null}
function sit(t){return obj(t.situation)}
function needsOf(t){return arr(t.needs_user).filter(function(n){return n&&OWNER_KINDS.indexOf(n.kind)>=0})}
function ownerNeeded(t){return sit(t).no_owner_decision===false||needsOf(t).length>0}
function isEngine(t){return obj(t.tracking).adapter==='engine'}
function groupOf(t){if(ownerNeeded(t))return 'need';var s=sit(t).stage;if(s==='done'||s==='closed')return 'done';if(s==='check'||s==='accept')return 'check';return 'doing'}
function tms(iso){var v=Date.parse(iso);return isNaN(v)?null:v}
function updatedAt(t){return obj(t.last_update).at||t.created_at||null}
function orderTasks(list){return list.map(function(t,i){return [t,i]}).sort(function(a,b){var o=(ownerNeeded(b[0])?1:0)-(ownerNeeded(a[0])?1:0);if(o)return o;
  var u=(tms(updatedAt(b[0]))||0)-(tms(updatedAt(a[0]))||0);return u||a[1]-b[1]}).map(function(x){return x[0]})}
function filterTasks(list,f){f=FILTER_KEYS.indexOf(f)>=0?f:'all';return orderTasks(list.filter(function(t){return f==='all'||groupOf(t)===f}))}
function countTasks(list){var c={all:list.length,need:0,doing:0,check:0,done:0};list.forEach(function(t){c[groupOf(t)]++});return c}

// ---- words and marks ----
function toneOf(t){if(ownerNeeded(t))return 'need';var st=sit(t).stage;
  return st==='done'?'ok':st==='closed'?'closed':st==='stopped'?'stop':st==='fix'?'fail':st==='unknown'?'unknown':(st==='check'||st==='accept')?'wait':st==='doing'?'run':'idle'}
function statusLine(t){if(ownerNeeded(t)){var k=(needsOf(t)[0]||{}).kind;return k==='approve'?'Cần bạn duyệt':k==='accept'?'Cần bạn nghiệm thu':'Cần bạn quyết'}return sit(t).label||'Chưa xác định'}
function whoOf(t){var s=sit(t);if(!s.next)return null;return s.next_by==='owner'?'Bạn':s.next_by==='checker'?'Bộ kiểm':s.next_by==='assigned'?'AI':'Chưa rõ'}
function mark(tone,label){return '<i class="mk mk-'+tone+'"'+(label?' role="img" aria-label="'+esc(label)+'"':' aria-hidden="true"')+'></i>'}
function chip(tone,text){return '<span class="chip c-'+tone+'">'+esc(text)+'</span>'}
function titleOf(t){return t.short_title||t.headline||t.title||t.plan||'Việc không tên'}
function projName(p){var s=String(p||'').replace(/[\\\/]+$/,'');return s.split(/[\\\/]/).pop()||s}
function needsProject(list){var s={};list.forEach(function(t){s[String(t.project||'').toLowerCase()]=1});return Object.keys(s).length>1}
// milestone ids become their position ("mốc M3" -> "mốc 3"): ids are internal codes, the position is what the owner sees in the bar
function msRows(t){var r=arr(obj(t.milestone_checks).rows);if(r.length)return r;
  return arr(t.milestones).map(function(m){var st=m.state==='passed'&&(m.stale||m.needs_recheck)?'recheck':(m.state==='failed'&&m.result==='inconclusive'?'inconclusive':m.state);
    return {id:m.id,title:m.title,state:st,label:MS_LABEL[st]||st,reason:m.reason||null,note:m.note||null,checks:[],failures:0}})}
function msIndex(t){var m={};msRows(t).forEach(function(r,i){if(r&&r.id)m[r.id]=i+1});return m}
function human(text,t){var m=msIndex(t),swap=function(all,pre,list,post){return pre+list.replace(/[A-Za-z0-9_-]+/g,function(id){return m[id]?String(m[id]):id})+(post||'')};
  return String(text==null?'':text).replace(/(mốc\s+)([A-Za-z0-9_-]+(?:(?:,\s*|\s+và\s+)[A-Za-z0-9_-]+)*)()/gi,swap).replace(/(mốc[^()]{0,40}\()([^()]*)(\))/gi,swap)}
function humanEvent(text,t){return human(String(text||'').replace(/\bverdict\b/g,'kết quả kiểm').replace(/: pass\b/g,': đạt').replace(/: fail\b/g,': không đạt').replace(/: inconclusive\b/g,': chưa kết luận'),t)}
function pad(n){return (n<10?'0':'')+n}
function fmtTime(iso){var v=tms(iso);if(v==null)return '';var d=new Date(v);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dur(sec){if(typeof sec!=='number'||!isFinite(sec)||sec<0)return '';var m=Math.round(sec/60);if(m<1)return Math.max(1,Math.round(sec))+' giây';if(m<60)return m+' phút';
  var h=Math.floor(m/60),r=m%60;if(h<24)return h+' giờ'+(r?' '+r+' phút':'');var d=Math.floor(h/24),hh=h%24;return d+' ngày'+(hh?' '+hh+' giờ':'')}
function since(a,b){var x=tms(a),y=tms(b);return x==null||y==null?null:Math.max(0,(y-x)/1000)}
function agoShort(iso,now){var s=since(iso,now);if(s==null)return '';if(s<60)return 'vừa xong';return dur(s).split(' ').slice(0,2).join(' ')}
function ago(iso,now){var a=agoShort(iso,now);return !a||a==='vừa xong'?a:a+' trước'}

// ---- routing: plain hash names only (#viec, #viec-<filter>, #viec-<filter>-<id>) ----
function routeOf(h){h=String(h||'').replace(/^#/,'');var m=/^viec(?:-([a-z]+))?(?:-([A-Za-z0-9-]+))?$/.exec(h);if(!m)return {view:'list',filter:'all',id:null};
  var f=FILTER_KEYS.indexOf(m[1])>=0?m[1]:'all';return m[2]?{view:'task',filter:f,id:m[2]}:{view:'list',filter:f,id:null}}
function hrefOf(r){var f=FILTER_KEYS.indexOf(r.filter)>=0?r.filter:'all';return r.view==='task'&&r.id?'#viec-'+f+'-'+safeId(r.id):'#viec-'+f}
function bodyClass(r){return 'view-'+(r.view==='task'?'task':'list')}
function listStateKey(f){return 'ui33-list-'+f}
function saveListState(store,f,top){try{store.setItem(listStateKey(f),String(Math.round(top||0)))}catch(e){}}
function loadListState(store,f){var top=0;try{var v=store.getItem(listStateKey(f));top=v==null?0:(parseInt(v,10)||0)}catch(e){top=0}return {filter:f,scrollTop:top}}

// ---- list ----
function hostItems(D){var out=[];arr(obj(obj(D).host_work).projects).forEach(function(p){arr(obj(obj(p).view).items).forEach(function(i){out.push(i)})});return out}
function hooksSeen(D){return arr(obj(obj(D).host_work).projects).some(function(p){return arr(obj(obj(p).view).hooks_seen).length>0})}
function planTitle(D,plan){var t=itemsOf(D).filter(function(x){return x.plan===plan})[0];return t?titleOf(t):null}
function hostLine(D,i,now){var o=obj(i.onecrew),tone=i.state==='running'?'run':i.state==='finished'?'ok':i.state==='waiting'?'wait':'unknown',owner=o.bound?planTitle(D,o.plan):null;
  return '<li class="host-item" data-host-state="'+esc(i.state)+'">'+mark(tone,i.state_label)+' '+(i.kind==='subagent'?'Agent phụ':'Lệnh nền')+': '+esc(i.summary||'không có mô tả')
    +' <span class="mut">('+esc(i.state_label||i.state)+(i.started_at?', từ '+esc(fmtTime(i.started_at)):'')+(owner?', việc “'+esc(owner)+'”':o.bound?'':', ngoài hợp đồng')+')</span></li>'}
function hostStrip(D,now){var items=hostItems(D),c={running:0,waiting:0,finished:0,unknown:0},line,tone='idle';items.forEach(function(i){c[i.state]=(c[i.state]||0)+1});
  if(!obj(D).host_work)line='chưa đọc được';
  else if(!items.length)line=hooksSeen(D)?'không thấy việc nào':'hook chưa báo tín hiệu nào';
  else{line=[c.running?c.running+' đang chạy':'',c.waiting?c.waiting+' đang chờ':'',c.finished?c.finished+' đã xong':'',c.unknown?c.unknown+' chưa rõ':''].filter(Boolean).join(', ');tone=c.running?'run':'ok'}
  var un={};arr(obj(D.host_work).projects).forEach(function(p){arr(obj(p.view).unobserved).forEach(function(x){un[x]=1})});
  var body=(items.length?'<ul>'+items.map(function(i){return hostLine(D,i,now)}).join('')+'</ul>':'<p>Không có dòng nào không có nghĩa là không có việc nền.</p>')
    +'<p class="mut small">'+esc(obj(D.host_work).note||'')+'</p>'+(Object.keys(un).length?'<p class="small">Chưa thấy được:</p><ul class="small mut">'+Object.keys(un).slice(0,8).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'');
  return '<details class="strip" id="hostbox"><summary>'+mark(tone,'')+'<span>Agent và việc nền: '+esc(line)+'</span></summary><div class="strip-body">'+body+'</div></details>'}
function resStrip(D){var rs=obj(obj(D).shared_resources),held=arr(rs.resources).filter(function(r){return !r.free}).length,wait=0,line;arr(rs.resources).forEach(function(r){wait+=arr(r.waiters).length});
  if(!D.shared_resources)line='chưa đọc được';else if(rs.error)line='không đọc được';else if(!rs.declared)line='máy chưa khai báo';else line=held?held+' đang được giữ'+(wait?', '+wait+' đang chờ':''):'đều trống';
  var body=rs.error?'<p>'+esc(rs.error)+'</p>':arr(rs.resources).length?'<ul>'+arr(rs.resources).map(function(r){return '<li>'+mark(r.free?'ok':'run','')+' '+esc(r.resource)+': '+esc(r.state_label)
    +arr(r.holders).map(function(h){return ', giữ bởi “'+esc(planTitle(D,h.plan)||h.plan||'chưa rõ')+'”'}).join('')+(arr(r.waiters).length?', '+arr(r.waiters).length+' việc chờ':'')+'</li>'}).join('')+'</ul>'
    :'<p>'+esc(rs.empty_note||'Không có tài nguyên nào.')+'</p>';
  return '<details class="strip" id="resbox"><summary>'+mark(held?'run':'idle','')+'<span>Tài nguyên dùng chung: '+esc(line)+'</span></summary><div class="strip-body">'+body+'<p class="mut small">'+esc(rs.note||'')+'</p></div></details>'}
function rowHtml(t,filter,multi,now,sel){var tone=toneOf(t),line=statusLine(t);
  return '<a class="row" href="'+hrefOf({view:'task',filter:filter,id:t.id})+'" data-id="'+esc(safeId(t.id))+'"'+(sel&&safeId(sel)===safeId(t.id)?' aria-current="page"':'')+' title="'+esc((t.headline||titleOf(t))+(multi?' ('+projName(t.project)+')':''))+'"'+(multi?' data-proj="'+esc(projName(t.project))+'"':'')+'>'
    +'<span class="gut">'+mark(tone,line)+'</span><span class="sline"><span class="tname">'+esc(titleOf(t))+'</span>'+chip(tone,line)+'</span>'
    +'<span class="rmeta"><time>'+esc(ago(updatedAt(t),now))+'</time></span></a>'}
function renderList(D,filter,sel){filter=FILTER_KEYS.indexOf(filter)>=0?filter:'all';var all=itemsOf(D),now=readAt(D),c=countTasks(all),list=filterTasks(all,filter),multi=needsProject(all),ov=obj(obj(D).overview);
  var h='<div class="hero'+(c.need?' has-need':'')+'">'+(c.need?mark('need','')+'<span><b>'+c.need+'</b> việc cần bạn</span>':mark('ok','')+'<span>Không có việc nào cần bạn</span>')+'</div>';
  h+='<nav class="filters" aria-label="Lọc việc">'+FILTERS.map(function(f){return '<a href="'+hrefOf({view:'list',filter:f[0]})+'" data-filter="'+f[0]+'"'+(f[0]===filter?' aria-current="true"':'')
    +(f[0]==='need'&&c.need?' class="hot"':'')+'>'+f[1]+' <b>'+c[f[0]]+'</b></a>'}).join('')+'</nav>';
  h+=hostStrip(D,now)+resStrip(D);
  var owners=list.filter(ownerNeeded),rest=list.filter(function(t){return !ownerNeeded(t)});
  h+='<div class="rows">';
  if(!list.length)h+='<p class="empty">Không có việc nào trong mục này.</p>';
  if(owners.length&&filter!=='need')h+='<h3 class="grp">Cần bạn</h3>';
  h+=owners.map(function(t){return rowHtml(t,filter,multi,now,sel)}).join('');
  if(owners.length&&rest.length)h+='<h3 class="grp">Các việc khác</h3>';
  h+=rest.map(function(t){return rowHtml(t,filter,multi,now,sel)}).join('')+'</div>';
  var cov=obj(ov.coverage);
  h+='<details class="lfoot"><summary>'+all.length+' việc, đọc lúc '+esc(fmtTime(now))+' (i)</summary><ul>'+['milestones','engine','external'].filter(function(k){return cov[k]}).map(function(k){return '<li>'+esc(cov[k])+'</li>'}).join('')
    +'<li>Chỉ đọc: trang không duyệt, không trả lời, không dừng hay tiếp tục việc. Nút sao chép chỉ chép mẫu lệnh.</li></ul></details>';
  return h}

// ---- task: four blocks, then sections closed by default ----
function msTally(t){var rows=msRows(t),s=obj(sit(t).milestones);var passed=typeof s.passed==='number'?s.passed:rows.filter(function(r){return r.state==='passed'}).length;return {passed:passed,total:rows.length}}
function nodeTone(n){n=obj(n);return (n.state==='verified'||n.state==='accepted')?'ok':n.phase==='held'||n.verification_result==='fail'?'fail':n.state==='produced'?'wait':n.phase==='running'?'run':'idle'}
function nodeWord(n){return {ok:'Đã kiểm đạt',fail:'Bị giữ hoặc không đạt',wait:'Có đầu ra, chờ kiểm',run:'Đang chạy',idle:'Chưa bắt đầu'}[nodeTone(n)]}
function progressBar(t){
  if(isEngine(t)){var nodes=obj(t.nodes),ids=Object.keys(nodes),ns=obj(t.nodes_summary),total=ids.length||ns.total||0,ok=ids.length?ids.filter(function(k){return nodeTone(nodes[k])==='ok'}).length:(ns.verified||0)+(ns.accepted||0);
    if(!total)return '<p class="one mut">Chưa có phần việc nào</p>';
    return '<div class="tally"><b>'+ok+'/'+total+'</b><span>phần đã kiểm đạt</span></div><div class="bar">'+(ids.length?ids.map(function(k){return '<i class="b-'+nodeTone(nodes[k])+'" title="'+esc(obj(t.node_titles)[k]||k)+'"></i>'}).join(''):'')+'</div>'}
  var rows=msRows(t),c=msTally(t);if(!rows.length)return '<p class="one mut">Chưa có mốc nào</p>';
  return '<div class="tally"><b>'+c.passed+'/'+c.total+'</b><span>mốc đạt</span></div><div class="bar">'+rows.map(function(r,i){return '<i class="b-'+(MS_TONE[r.state]||'idle')+'" title="Mốc '+(i+1)+': '+esc(r.title||'')+', '+esc(MS_LABEL[r.state]||r.state)+'"></i>'}).join('')+'</div>'}
function lastCheck(t){var best=null;msRows(t).forEach(function(r){arr(r.checks).forEach(function(c){var at=c.recorded||c.ended||c.started;if(at&&(!best||tms(at)>tms(best.at)))best={at:at,c:c}})});return best}
function resultTone(c){return c.result==='pass'?'ok':c.result==='fail'?'fail':c.result==='inconclusive'?'wait':c.state==='open'?'run':c.state==='lost'?'unknown':'idle'}
function resultWord(c){return RESULT_WORD[c.result]||(c.state==='open'?'Đang chạy':c.state==='lost'?'Mất tín hiệu':c.state==='abandoned'?'Bỏ dở':'Chưa có kết quả')}
function blockOut(D,t){var ov=obj(t.owner_view),what=arr(ov.user_sees)[0]||ov.request||'',lc=isEngine(t)?null:lastCheck(t),now=readAt(D);
  return '<section class="blk" id="b-out"><h3>Đầu ra</h3>'+progressBar(t)+(what?'<p class="one clamp">'+esc(human(what,t))+'</p>':'')
    +(isEngine(t)?'':'<p class="small mut">'+(lc?'Lần kiểm cuối: '+esc(resultWord(lc.c).toLowerCase())+', '+esc(ago(lc.at,now)):'Chưa có lần kiểm nào')+'</p>')+'</section>'}
function validityOf(t){var v=t.validity;if(v&&v.label)return v;
  if(isEngine(t)){var nodes=obj(t.nodes),ids=Object.keys(nodes),ok=ids.filter(function(k){return nodeTone(nodes[k])==='ok'}).length;return {kind:ids.length&&ok===ids.length?'valid':'parts',label:'Theo từng phần',text:ok+'/'+ids.length+' phần đã kiểm đạt; mỗi phần có độ tin riêng'}}
  return {kind:'unknown',label:'Chưa xác định',text:'Sổ không đủ để nói kết quả còn đúng hay không'}}
function blockTrust(D,t){var v=validityOf(t),tone=VALID_TONE[v.kind]||'unknown';
  return '<section class="blk" id="b-trust"><h3>Còn tin được không</h3><p class="big x-'+tone+'" data-validity="'+esc(v.kind)+'">'+mark(tone,'')+esc(v.label)+'</p><p class="one clamp small">'+esc(human(v.text,t))+'</p></section>'}
function blockNext(D,t){var s=sit(t),who=whoOf(t),act=obj(s.activity),now=readAt(D),done=s.stage==='done'||s.stage==='closed',h='<section class="blk" id="b-next"><h3>Bước tiếp theo</h3>';
  var mine=ownerNeeded(t)&&needsOf(t).length?({approve:'Bạn duyệt kế hoạch',accept:'Bạn nghiệm thu'}[needsOf(t)[0].kind]||'Bạn quyết định'):null;
  if(s.next)h+='<p class="one strong clamp">'+esc(mine||human(s.next,t))+'</p><p class="who">Ai làm: '+'<span class="chip c-'+WHO_TONE[who]+'" title="'+esc(s.next_by_text||'')+'">'+esc(who)+'</span></p>';
  else h+='<p class="one">'+(done?'Không còn bước nào':'Chưa biết bước tiếp theo')+'</p>';
  if(act.running)h+='<p class="act run"><i class="pulse" aria-hidden="true"></i><span>Đang chạy'+(act.since?' từ '+esc(fmtTime(act.since)):'')+(act.last_signal?', tín hiệu cuối '+esc(ago(act.last_signal,now)):'')+'</span></p>';
  else if(!done)h+='<p class="act">'+mark('idle','')+'<span>Không có gì đang chạy</span></p>';
  if(!done&&!isEngine(t)&&!ownerNeeded(t)&&s.stage!=='stopped')h+='<p class="small mut" data-honest="1">Giữa hai lần kiểm, trang không thấy agent làm gì.</p>';
  if(s.repairs)h+='<p class="small">Lượt sửa: <b>'+esc(s.repairs.used)+'/'+esc(s.repairs.max)+'</b></p>';
  if(s.warning)h+='<p class="warn" role="note" title="'+esc(human(s.warning,t))+'">'+mark('wait','')+'<span>Lần kiểm tới là lần thử cuối. Chỉ là cảnh báo, bạn chưa cần làm gì.</span></p>';
  return h+'</section>'}
function copyBtn(cmd){return cmd?'<button type="button" class="copy" data-copy="'+esc(cmd)+'">Sao chép lệnh</button>':'<span class="small mut">Chưa có lệnh: trang chưa xác minh chương trình của dự án</span>'}
function blockDecide(D,t){var needs=needsOf(t),s=sit(t);
  if(!needs.length)return '<section class="blk" id="b-dec"><h3>Bạn cần quyết gì</h3><p class="big x-ok">'+mark('ok','')+'Không có gì</p></section>';
  var n=needs.filter(function(x){return arr(x.options).length})[0]||needs[0],ask=s.next_by==='owner'&&s.next?s.next:(n.owner_ask||n.question||'Quyết định của bạn'),opts=arr(n.options);
  var h='<section class="blk need decision" id="b-dec"><h3>Bạn cần quyết gì</h3><p class="one strong clamp">'+esc(human(ask,t))+'</p>';
  if(opts.length)h+='<ul class="opts">'+opts.map(function(o){return '<li class="opt"><b>'+esc(o.label||o.id)+'</b><span class="cons">Hệ quả: '+esc(o.consequence||o.impact||'câu hỏi không ghi hệ quả')+'</span>'+copyBtn(o.human_command)+'</li>'}).join('')+'</ul>';
  else h+='<p>'+copyBtn(n.human_command)+'</p>';
  return h+'<p class="small mut">Sao chép chưa phải là duyệt. Dán vào PowerShell, sửa phần &lt;…&gt; rồi chạy.'+(obj(D).sample?' Lệnh mẫu chỉ để minh họa.':'')+'</p></section>'}
function sectionCount(D,t,kind){var w=obj(t.work);
  if(kind==='checks'){var r=isEngine(t)?Object.keys(obj(t.nodes)):msRows(t);return {text:r.length?r.length+(isEngine(t)?' phần':' mốc'):'không có',zero:!r.length}}
  if(kind==='repair'){var f=isEngine(t)?arr(w.repairs).length:msRows(t).reduce(function(a,r){return a+(r.failures||0)},0);return {text:f?f+(isEngine(t)?' lần sửa':' lần không đạt'):'không có',zero:!f}}
  if(kind==='plan'){var c=arr(w.changes).length;return {text:c?c+' lần sửa':'không có',zero:!c}}
  if(kind==='wait'){var n=t.timeline_total||arr(t.timeline).length;return {text:n?n+' sự kiện':'',zero:!n}}
  if(kind==='evidence'){var e=t.evidence_count||arr(obj(w.checks).runs).length;return {text:e?e+' mục':'không có',zero:!e}}
  if(kind==='agents'){var hi=hostOfTask(D,t).length;return {text:isEngine(t)?Object.keys(obj(t.nodes)).length+' phần'+(hi?', '+hi+' việc nền':''):(hi?hi+' việc nền':'chỉ thấy lần kiểm'),zero:false}}
  if(kind==='res'){var x=resOfTask(D,t).length;return {text:x?x+' khóa':'không có',zero:!x}}
  return {text:'',zero:false}}
function renderTask(D,t){if(!t)return '<div class="pick"><p>Chọn một việc trong danh sách.</p></div>';
  var now=readAt(D),tone=toneOf(t),line=statusLine(t);
  var h='<article class="task" data-id="'+esc(safeId(t.id))+'"><div class="thead"><button type="button" id="back">‹ Quay lại</button><h2>'+esc(t.headline||titleOf(t))+'</h2>'
    +'<p class="tmeta">'+chip(tone,line)+'<span>'+esc(projName(t.project))+'</span><span>cập nhật '+esc(ago(updatedAt(t),now))+'</span></p></div>';
  h+='<div class="four">'+blockOut(D,t)+blockTrust(D,t)+blockNext(D,t)+blockDecide(D,t)+'</div>';
  h+='<div class="more"><h3>Xem sâu</h3>'+SECTIONS.map(function(s){var c=sectionCount(D,t,s[0]);
    return '<details class="d" data-kind="'+s[0]+'"><summary><span>'+s[1]+'</span>'+(c.text?'<span class="cnt">'+esc(c.text)+'</span>':'')+'</summary><div class="dbody">'+renderDetail(D,t,s[0])+'</div></details>'}).join('')+'</div></article>';
  return h}

// ---- sections ----
function renderDetail(D,t,kind){try{return (DETAIL[kind]||function(){return ''})(D,t)}catch(e){return '<p class="mut">Không vẽ được phần này: '+esc(e&&e.message)+'</p>'}}
function hostOfTask(D,t){var out=[],key=String(t.project||'').toLowerCase();arr(obj(obj(D).host_work).projects).forEach(function(p){if(String(p.path||'').toLowerCase()!==key)return;
  arr(obj(p.view).items).forEach(function(i){var o=obj(i.onecrew);if(o.bound&&o.plan===t.plan)out.push(i)})});return out}
function resOfTask(D,t){var out=[];arr(obj(obj(D).shared_resources).resources).forEach(function(r){arr(r.holders).forEach(function(h){if(h.plan===t.plan)out.push({r:r,role:'holder',x:h})});
  arr(r.waiters).forEach(function(w){if(w.plan===t.plan)out.push({r:r,role:'waiter',x:w})})});return out}
function checksTable(checks){if(!checks.length)return '<p class="small mut">Chưa có lần kiểm nào.</p>';
  return '<div class="scroll"><table class="tbl"><tr><th>Lần</th><th>Kết quả</th><th>Bắt đầu</th><th>Kết thúc</th><th>Chạy</th></tr>'+checks.map(function(c,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(resultWord(c))+'</td><td>'+esc(fmtTime(c.started)||'—')+'</td><td>'+esc(fmtTime(c.ended||c.recorded)||'—')+'</td><td>'+esc(dur(c.seconds)||'—')+'</td></tr>'}).join('')+'</table></div>'}
function repairLoop(row){var out=[],checks=arr(row.checks),fixes=0,rp=obj(row.repairs);
  checks.forEach(function(c,i){if(i>0&&checks[i-1].result&&checks[i-1].result!=='pass'){fixes++;out.push({kind:'fix',text:'Sửa (lượt '+fixes+')'})}
    out.push({kind:'check',tone:resultTone(c),text:'Lần kiểm '+(i+1)+': '+resultWord(c).toLowerCase(),t:fmtTime(c.recorded||c.ended||c.started),d:dur(c.seconds)})});
  var last=checks[checks.length-1];
  if(row.state==='stopped')out.push({kind:'last',text:'Đã dừng: hết lượt sửa, chờ bạn quyết'});
  else if(last&&last.result&&last.result!=='pass'){if(rp.left===0)out.push({kind:'last',text:'Lần kiểm tới là lần thử cuối'});else if(typeof rp.left==='number')out.push({kind:'next',text:'Còn '+rp.left+' lượt sửa'})}
  return out}
var DETAIL={
  scope:function(D,t){var ov=obj(t.owner_view);if(!ov.present&&!ov.request)return '<p class="mut">Hợp đồng không có phần trình bày cho chủ.</p>';
    return (ov.request?'<h4>Yêu cầu</h4><p>'+esc(ov.request)+'</p>':'')+(arr(ov.user_sees).length?'<h4>Người dùng sẽ thấy</h4><ul>'+arr(ov.user_sees).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')
      +(arr(ov.acceptance_steps).length?'<h4>Cách bạn nghiệm thu</h4><ol>'+arr(ov.acceptance_steps).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':'')+(ov.not_doing?'<h4>Không làm</h4><p>'+esc(ov.not_doing)+'</p>':'')},
  checks:function(D,t){
    if(isEngine(t)){var nodes=obj(t.nodes),ids=Object.keys(nodes);if(!ids.length)return '<p class="mut">Chưa có phần việc nào.</p>';
      return ids.map(function(k){var n=nodes[k];return '<div class="ms"><div class="mshead">'+mark(nodeTone(n),'')+'<span class="clamp">'+esc(obj(t.node_titles)[k]||k)+'</span>'+chip(nodeTone(n),nodeWord(n))+'</div></div>'}).join('')}
    var rows=msRows(t);if(!rows.length)return '<p class="mut">Hợp đồng chưa có mốc nào.</p>';
    return rows.map(function(r,i){var tone=MS_TONE[r.state]||'idle',checks=arr(r.checks);
      return '<div class="ms" data-ms="'+(i+1)+'"><div class="mshead"><span class="num">'+(i+1)+'</span><span class="clamp">'+esc(r.title||r.id)+'</span>'+chip(tone,r.label||MS_LABEL[r.state]||r.state)+'</div>'
        +(checks.length?'<div class="sq" aria-hidden="true">'+checks.map(function(c){return '<i class="b-'+resultTone(c)+'"></i>'}).join('')+'</div>':'')
        +(r.reason?'<p class="small">Vì sao: '+esc(r.reason)+'</p>':'')+(r.note?'<p class="small mut">'+esc(r.note)+'</p>':'')+checksTable(checks)+'</div>'}).join('')},
  repair:function(D,t){var s=sit(t),w=obj(t.work);
    if(isEngine(t)){var rp=arr(w.repairs);if(!rp.length)return '<p class="mut">Chưa có vòng sửa nào.</p>';
      return '<ul>'+rp.map(function(r){return '<li>'+esc(obj(t.node_titles)[r.node]||r.node)+': '+esc(r.reason||'')+' <span class="mut">('+esc({verified:'đã kiểm lại đạt',partial:'kiểm lại đạt một phần',unverified:'chưa kiểm lại'}[r.status]||r.status)+')</span></li>'}).join('')+'</ul>'}
    var rows=msRows(t).map(function(r,i){return {r:r,i:i}}).filter(function(x){return (x.r.failures||0)>0||['failed','inconclusive','stopped'].indexOf(x.r.state)>=0});
    if(!rows.length)return '<p class="mut">Chưa có lần kiểm nào không đạt.</p>';
    return rows.map(function(x){var r=x.r,rp=obj(r.repairs);
      return '<div class="ms"><div class="mshead"><span class="num">'+(x.i+1)+'</span><span class="clamp">'+esc(r.title||r.id)+'</span>'+(rp.max?chip(rp.left===0?'fail':'wait','Đã dùng '+rp.used+'/'+rp.max+' lượt sửa'+(rp.left===0?'':', còn '+rp.left)):'')+'</div>'
        +(r.reason?'<p class="small">Lỗi: '+esc(r.reason)+'</p>':'')
        +'<ol class="loop">'+repairLoop(r).map(function(s){return '<li class="'+s.kind+'">'+esc(s.text)+(s.t?' <span class="mut">'+esc(s.t)+(s.d?', '+esc(s.d):'')+'</span>':'')+'</li>'}).join('')+'</ol></div>'}).join('')},
  plan:function(D,t){var ch=arr(obj(t.work).changes);if(!ch.length)return '<p class="mut">Kế hoạch chưa sửa lần nào.</p>';
    var CHANGE={added:'thêm',removed:'bỏ',changed:'đổi'};
    return ch.slice().reverse().map(function(c){var head=c.kind==='contract'?'Bản '+esc(c.revision):c.kind==='retry'?'Làm lại '+esc(obj(t.node_titles)[c.node]||c.node||''):c.kind==='initial'?'Kế hoạch nội bộ đầu tiên':'Sửa kế hoạch nội bộ';
      return '<div class="chg"><p class="mshead"><b>'+head+'</b><span class="mut small">'+esc(fmtTime(c.at))+'</span>'+(c.approved?chip('ok','đã duyệt'):c.approved===false?chip('wait','chưa duyệt'):'')+'</p>'
        +(c.reason?'<p class="small mut">'+esc(c.reason)+'</p>':'')
        +arr(c.diff).map(function(x){return '<p class="small"><b>'+esc(pathWord(x.path))+'</b> <span class="mut">('+esc(CHANGE[x.change]||x.change)+')</span></p><div class="ba"><div class="before"><span class="bl">Trước</span><span class="bv">'+esc(x.before==null?'—':x.before)+'</span></div><div class="after"><span class="bl">Sau</span><span class="av">'+esc(x.after==null?'—':x.after)+'</span></div></div>'}).join('')
        +(c.diff_total>arr(c.diff).length?'<p class="small mut">Còn '+(c.diff_total-arr(c.diff).length)+' thay đổi nữa không hiện.</p>':'')+'</div>'}).join('')},
  wait:function(D,t){var now=readAt(D),s=sit(t),h='<ul class="waits">',n=0;
    if(ownerNeeded(t)){var req=arr(t.requests).filter(function(r){return r.state==='pending'})[0],from=(req&&req.created_at)||updatedAt(t);n++;
      h+='<li data-wait="owner"><b>Việc đang chờ bạn</b> từ '+esc(fmtTime(from))+' ('+esc(dur(since(from,now))||'vừa xong')+')</li>'}
    arr(t.waits).forEach(function(w){n++;var end=w.until&&w.until!=='unknown'?w.until:null;
      h+='<li data-wait="'+(w.open?'open':'closed')+'"><b>'+(w.source==='workflow.mode'?'Việc chờ':'Agent chờ')+'</b>: '+esc(w.reason||'không ghi lý do')+', từ '+esc(fmtTime(w.since))+(w.open?' (đang chờ '+esc(dur(since(w.since,now)))+')':end?' (đã chờ '+esc(dur(since(w.since,end)))+')':' (không rõ lúc hết)')+'</li>'});
    h+=n?'</ul>':'</ul><p class="mut small">Sổ không ghi lần chờ nào.</p>';
    var el=obj(t.elapsed);if(el.seconds!=null)h+='<p class="small">Đã qua '+esc(dur(el.seconds))+' <span class="mut">'+esc(el.label||'')+'</span></p>';
    var tl=arr(t.timeline).slice().reverse();
    if(tl.length)h+='<h4>Dòng thời gian</h4><ol class="tl">'+tl.slice(0,40).map(function(e){return '<li><time>'+esc(fmtTime(e.at))+'</time><span>'+esc(humanEvent(e.summary||e.kind,t))+'</span></li>'}).join('')+'</ol>'
      +((t.timeline_total||0)>Math.min(40,tl.length)?'<p class="small mut">Hiện '+Math.min(40,tl.length)+'/'+esc(t.timeline_total)+' sự kiện gần nhất.</p>':'');
    else h+='<p class="mut small">'+(t.has_detail?'Chưa có sự kiện nào.':'Chưa đọc chi tiết của việc này.')+'</p>';
    return h},
  evidence:function(D,t){var runs=arr(obj(obj(t.work).checks).runs).slice().reverse(),idx=msIndex(t),ev=arr(t.evidence_index).slice().reverse(),h='';
    h+='<p>'+esc(t.evidence_count||0)+' mục bằng chứng trong kho.</p>';
    if(runs.length)h+='<div class="scroll"><table class="tbl"><tr><th>Lúc</th><th>Phần</th><th>Kết quả</th><th>Lệnh kiểm</th><th>Biên nhận</th></tr>'+runs.map(function(r){var o=r.outputs;
      return '<tr data-run="'+esc(r.id)+'"><td>'+esc(fmtTime(r.at))+'</td><td>'+esc(idx[r.node]?'Mốc '+idx[r.node]:(obj(t.node_titles)[r.node]?r.node:r.node||''))+'</td><td>'+esc({pass:'Đạt',fail:'Không đạt',unknown:'Chưa rõ'}[r.status]||r.status)+(r.stale?' (bản cũ)':'')+'</td>'
        +'<td>'+(o?'mã: '+esc(o.exit_code==null?'—':o.exit_code)+(o.timed_out?', hết giờ':''):'—')+'</td><td><code>'+esc(String(r.receipt||'').slice(0,12))+'</code></td></tr>'}).join('')+'</table></div>';
    else h+='<p class="mut small">Chưa có lần kiểm nào có biên nhận.</p>';
    if(ev.length)h+='<h4>Mục mới nhất</h4><ul>'+ev.slice(0,10).map(function(e){return '<li>'+esc(humanEvent(e.label||e.kind,t))+' <span class="mut">'+esc(fmtTime(e.at))+'</span> <code>'+esc(String(e.key||'').slice(0,12))+'</code></li>'}).join('')+'</ul>';
    return h},
  agents:function(D,t){var now=readAt(D),h='';
    if(isEngine(t)){var nodes=obj(t.nodes),ax=obj(obj(t.gantt).axis),a0=tms(ax.start),a1=tms(ax.end||ax.now)||tms(now),actors=arr(obj(t.work).actors),rows=arr(obj(t.gantt).rows);
      h+=Object.keys(nodes).map(function(k){var n=nodes[k],mine=rows.filter(function(r){return r.node===k}),p=obj(obj(t.progress)[k]),ac=actors.filter(function(a){return a.node===k&&a.role==='executed'&&(a.model||a.actor||a.provider)})[0],sig=p.observed_at||p.received_at;
        var lane=a0!=null&&a1>a0&&mine.length?'<div class="lane" aria-hidden="true">'+mine.map(function(r){return arr(r.segments).map(function(sg){var f=tms(sg.from),to=tms(sg.to);if(f==null||to==null)return '';
          return '<i class="s-'+esc(sg.kind)+'" style="left:'+((f-a0)/(a1-a0)*100).toFixed(2)+'%;width:'+Math.max(.8,(to-f)/(a1-a0)*100).toFixed(2)+'%"></i>'}).join('')}).join('')+'</div>':'';
        return '<article class="part" data-part="'+esc(k)+'"><div class="mshead">'+mark(nodeTone(n),'')+'<b class="clamp">'+esc(obj(t.node_titles)[k]||k)+'</b>'+chip(nodeTone(n),nodeWord(n))+'</div>'
          +'<p class="small">Agent: <b class="agent-who">'+esc(ac?(ac.model||ac.actor||ac.provider):'chưa biết')+'</b>, '+mine.length+' lượt, tín hiệu cuối '+(sig?esc(fmtTime(sig))+' ('+esc(ago(sig,now))+')':'chưa có')+(p.reason?'. '+esc(p.reason):'')+'</p>'+lane+'</article>'}).join('')||'<p class="mut">Chưa có phần việc nào.</p>'}
    else h+='<p class="honest">'+esc(BETWEEN_CHECKS)+'</p>';
    var mine=hostOfTask(D,t);
    h+='<h4>Việc nền hook báo</h4>'+(mine.length?'<ul>'+mine.map(function(i){return hostLine(D,i,now)}).join('')+'</ul>':'<p class="small mut">Hook chưa báo việc nền nào của việc này (không có nghĩa là không có).</p>');
    return h},
  res:function(D,t){var rs=obj(obj(D).shared_resources);if(!D.shared_resources)return '<p class="mut">Chưa đọc được tài nguyên dùng chung.</p>';if(rs.error)return '<p class="mut">Không đọc được kho khóa: '+esc(rs.error)+'</p>';
    var mine=resOfTask(D,t);if(!mine.length)return '<p class="mut">'+(rs.declared?'Việc này không giữ hay chờ tài nguyên nào.':'Máy này chưa khai báo tài nguyên dùng chung.')+'</p>';
    return '<ul>'+mine.map(function(m){var x=m.x;return '<li data-res-role="'+m.role+'">'+mark(m.role==='holder'?'run':'wait','')+' <b>'+esc(m.r.resource)+'</b>: '
      +(m.role==='holder'?'đang giữ ('+esc(x.mode_label||'')+'), từ '+esc(fmtTime(x.since))+(x.until?', hẹn nhả '+esc(fmtTime(x.until)):''):'chờ, vị trí <b>'+esc(x.position)+'</b>'+(x.since?', từ '+esc(fmtTime(x.since)):''))+'</li>'}).join('')+'</ul>'},
  tech:function(D,t){var w=obj(t.work),kv=[['Kế hoạch',t.plan],['Bộ chọn',t.selector],['Mã việc',t.id],['Dự án',t.project],['Bản hợp đồng',t.contract_revision],['Cách theo dõi',isEngine(t)?'nhiều phần (engine)':'theo mốc'],
      ['So với bản hiện tại',t.compared==='compared'?'đã so':t.compared==='unknown'?'không đọc được dự án':'không so'],['Trạng thái gốc',t.root_status],['Bằng chứng cuối',obj(t.last_evidence).label?obj(t.last_evidence).label+' '+(obj(t.last_evidence).ref||''):'']];
    return '<dl class="kv">'+kv.filter(function(x){return x[1]!=null&&x[1]!==''}).map(function(x){return '<dt>'+esc(x[0])+'</dt><dd><code>'+esc(x[1])+'</code></dd>'}).join('')+'</dl>'
      +(arr(w.limitations).length?'<h4>Giới hạn</h4><ul class="small">'+arr(w.limitations).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')
      +(arr(obj(t.tracking).errors).length?'<h4>Lỗi đọc</h4><ul class="small">'+arr(obj(t.tracking).errors).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')}
};
function pathWord(p){p=String(p||'');var m=/^decisions\[(.+)\]$/.exec(p);if(m)return 'Quyết định '+m[1];m=/^items\[(.+)\]$/.exec(p);if(m)return 'Mục '+m[1];m=/^milestones\[(.+)\]/.exec(p);if(m)return 'Mốc '+m[1];
  return {'origin.quote':'Lời chủ giao','title':'Tên việc','scope':'Phạm vi','non_goals':'Không làm','output':'Đầu ra','presentation':'Trình bày cho chủ'}[p]||p}

// ---- browser wiring (never runs under Node: no document there) ----
function wire(){var D=JSON.parse(document.getElementById('page-data').textContent),lp=document.getElementById('listpane'),tp=document.getElementById('taskpane'),store=null,root=document.documentElement;
  try{store=window.sessionStorage}catch(e){store=null}
  try{var th=window.localStorage.getItem('ui33-theme');if(th==='light'||th==='dark')root.setAttribute('data-theme',th)}catch(e){}
  var badge=document.getElementById('srcbadge');badge.textContent=D.label||'';if(!D.sample)badge.classList.add('real');
  var cur={filter:null,id:null},fromList=false,toastTimer=null;
  function render(){var r=routeOf(location.hash);document.body.className=bodyClass(r);
    if(r.filter!==cur.filter){lp.innerHTML=renderList(D,r.filter,r.id);cur.filter=r.filter}
    else Array.prototype.forEach.call(lp.querySelectorAll('a.row'),function(a){if(r.id&&a.getAttribute('data-id')===safeId(r.id))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
    if(r.view==='list'||window.innerWidth>=900){var top=loadListState(store,r.filter).scrollTop;lp.scrollTop=top}
    if((r.id||null)!==cur.id){var t=r.id?findTask(D,r.id):null;tp.innerHTML=renderTask(D,t);tp.scrollTop=0;cur.id=r.id||null;document.title=t?titleOf(t)+' · Công việc OneCrew':'Công việc OneCrew'}}
  function showToast(text){var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
    el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2600)}
  function copyText(text){var done=function(){showToast('Đã sao chép lệnh. Sao chép chưa phải là duyệt.')},fail=function(){showToast('Trình duyệt chặn sao chép.')};
    try{navigator.clipboard.writeText(text).then(done,fail)}catch(e){fail()}}
  lp.addEventListener('scroll',function(){if(cur.filter)saveListState(store,cur.filter,lp.scrollTop)},{passive:true});
  lp.addEventListener('click',function(e){if(e.target.closest('a.row')){saveListState(store,cur.filter,lp.scrollTop);fromList=true}});
  document.addEventListener('click',function(e){var c=e.target.closest('[data-copy]');if(c){copyText(c.getAttribute('data-copy'));return}
    if(e.target.closest('#back')){var r=routeOf(location.hash);if(fromList){fromList=false;history.back()}else location.hash=hrefOf({view:'list',filter:r.filter});return}
    if(e.target.closest('#theme')){var now=root.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),next=now==='dark'?'light':'dark';
      root.setAttribute('data-theme',next);try{window.localStorage.setItem('ui33-theme',next)}catch(err){}}});
  window.addEventListener('hashchange',render);
  render()}
if(typeof document!=='undefined')wire();
</script>
