[project]
name = "onecrew"
version = "2.2.0.dev3"
description = "OneCrew v2: an AI work contract (approved plan, independent verdicts, human acceptance)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
onecrew = "onecrew.v2.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The wheel ships the core and v2 only: exactly these modules (docs/v2-core.vi.md). Every module the others import (lazy imports
# included) is in the list; tests/test_g1_core.py checks that, so a v1-only module cannot slip in or a needed one drop out.
# The packages onecrew, onecrew.v2 and onecrew.v2.verifiers come in through their modules (their __init__.py is added by the build).
# v1 (job, work, delivery, ...) runs from a checkout through onecrew_cli.py.
[tool.setuptools]
packages = ["onecrew.templates"]          # only the data package (owner-rules templates); the modules below bring their own packages in
py-modules = [
    "onecrew.budget_core",
    "onecrew.dependency_core",
    "onecrew.finding_core",
    "onecrew.independence",
    "onecrew.interventions",
    "onecrew.ledger",
    "onecrew.model_preferences",
    "onecrew.qc_intake",
    "onecrew.routing",
    "onecrew.snapshots",
    "onecrew.specs",
    "onecrew.task_intake",
    "onecrew.work_contract",
    "onecrew.v2.active_plan",
    "onecrew.v2.authority",
    "onecrew.v2.boundary",
    "onecrew.v2.claude_cli",
    "onecrew.v2.compat",
    "onecrew.v2.compat_cli",
    "onecrew.v2.compat_scan",
    "onecrew.v2.cards",
    "onecrew.v2.cli",
    "onecrew.v2.contract",
    "onecrew.v2.decisions",
    "onecrew.v2.gate",
    "onecrew.v2.findings",
    "onecrew.v2.hook_cli",
    "onecrew.v2.install",
    "onecrew.v2.items",
    "onecrew.v2.lint",
    "onecrew.v2.messages",
    "onecrew.v2.owner_cli",
    "onecrew.v2.ownership",
    "onecrew.v2.plan",
    "onecrew.v2.plan_binding",
    "onecrew.v2.plan_cli",
    "onecrew.v2.providers",
    "onecrew.v2.proposal",
    "onecrew.v2.report",
    "onecrew.v2.retention",
    "onecrew.v2.verifiers.port",
    "onecrew.v2.verifiers.doc",
    "onecrew.v2.verifiers.data",
    "onecrew.v2.verifiers.ops",
    "onecrew.v2.verifiers.artifact",
    "onecrew.v2.executors",
    "onecrew.v2.metrics",
    "onecrew.v2.estimates",
    "onecrew.v2.questions",
    "onecrew.v2.context",
    "onecrew.v2.outcome",
    "onecrew.v2.resume_pack",
    "onecrew.v2.evidence_cli",
    "onecrew.outcome_core",
    "onecrew.contract_diff",
    "onecrew.evaluation_core",
    "onecrew.v2.review_policy",
    "onecrew.v2.namespaces",
    "onecrew.v2.step0",
    "onecrew.v2.survey",
    "onecrew.v2.verdict",
    "onecrew.v2.where",
    "onecrew.v2.verifiers.advisor",
    "onecrew.v2.verifiers.command",
    "onecrew.v2.verifiers.reviewer",
]

# The owner-rules templates (vi and en) ship inside the wheel; `plan rules init` and `onecrew init` read them with importlib.resources.
[tool.setuptools.package-data]
"onecrew.templates" = ["*.md"]
