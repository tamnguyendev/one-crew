[project]
name = "onecrew"
version = "2.1.0"
description = "Local, content-bound spec review CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
onecrew = "onecrew.cli:main"
onecrew-entry-mcp = "onecrew.mcp_entry:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["onecrew"]
