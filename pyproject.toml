[project]
name = "onecrew"
version = "2.2.0.dev17"
description = "OneCrew v2: an AI work contract (approved plan, independent verdicts, human acceptance)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
onecrew = "onecrew.console:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The wheel ships the core and v2 only: exactly these modules (docs/v2-core.vi.md). Every module the others import (lazy imports
# included) is in the list; tests/test_g1_core.py checks that, so a v1-only module cannot slip in or a needed one drop out.
# The packages onecrew, onecrew.v2 and onecrew.v2.verifiers come in through their modules (their __init__.py is added by the build).
# v1 (job, work, delivery, ...) runs from a checkout through onecrew_cli.py.
[tool.setuptools]
packages = ["onecrew.templates"]          # only the data package (owner-rules templates); the modules below bring their own packages in
py-modules = [
    "onecrew.console",
    "onecrew.admission_core",
    "onecrew.artifact_core",
    "onecrew.artifact_provider_core",
    "onecrew.control_core",
    "onecrew.effects_core",
